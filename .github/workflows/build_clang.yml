name: BUILD_CLANG(V1)

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM/Clang 版本"
        required: true
        default: "23"
        type: choice
        options:
          - "23"
          - "22"
      release_archives:
        description: "enable release archives"
        default: true
        type: boolean

jobs:
  pre:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    outputs:
      ACTOR_LC: ${{ steps.set_case_params.outputs.ACTOR_LC }}
    steps:
      - name: set lower case name
        id: set_case_params
        run: |
          echo "ACTOR_LC=${ACTOR,,}" >> "$GITHUB_OUTPUT"
        env:
          ACTOR: '${{ github.actor }}'

  build-clang:
    runs-on: ubuntu-latest
    needs: [pre]
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.1
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push (clang)
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/mainline/
          file: ${{ github.workspace }}/mainline/Base-Clang.Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            LLVM_VERSION=${{ inputs.llvm_version }}
          push: ${{ inputs.release_archives }}
          provenance: false
          # debian-slim:clang 为下游统一引用的滚动 tag；clang-<版本> 为版本锚定 tag
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/debian-slim:clang
            ${{ secrets.DOCKERHUB_USERNAME }}/debian-slim:clang-${{ inputs.llvm_version }}
            ghcr.io/${{ needs.pre.outputs.ACTOR_LC }}/debian-slim:clang
            ghcr.io/${{ needs.pre.outputs.ACTOR_LC }}/debian-slim:clang-${{ inputs.llvm_version }}
          no-cache: true
